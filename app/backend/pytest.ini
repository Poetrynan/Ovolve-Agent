[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
; aiohttp 的 app[...] 必须用 AppKey 而不是裸字符串键（键定义在
; server/http_server.py：ROUTER_KEY / SESSION_HOST_KEY）。此前 30 处裸字符串键
; 刷出 14 条 NotAppKeyWarning，现已根治；这条把它设成 error，防止有人写回去。
; 用消息正则而不是 warning 类的导入路径，避免绑死 aiohttp 的内部模块名。
filterwarnings =
    ignore::DeprecationWarning:aiohttp.*
    ignore::DeprecationWarning:websockets.*
    ignore::UserWarning:urllib3.*
    ignore::DeprecationWarning:cryptography.*
    ignore:enable_cleanup_closed ignored:DeprecationWarning
    error:.*web\.AppKey instances for keys

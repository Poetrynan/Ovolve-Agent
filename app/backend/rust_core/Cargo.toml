[package]
name = "ovolve-core"
version = "0.1.0"
edition = "2021"
description = "Ovolve Core - Performance-critical modules for Ovolve Agent"

[lib]
name = "ovolve_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
parking_lot = "0.12"
lru = "0.12"
regex = "1"
unicode-segmentation = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
# Renamed dependency: this crate's own lib is also named `ovolve_core`
# (the Python extension module), so the core-algorithms crate needs a
# distinct extern name to be referenceable in code.
ovolve_kernels = { package = "ovolve_core", path = "../../../crates/ovolve_core" }

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Power",
] }

# Image processing
image = { version = "0.25", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["image", "image-processing"]
image-processing = ["image", "base64"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

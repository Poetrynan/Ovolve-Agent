<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0052ff" />
    <meta name="description" content="Ovolve — Multi-Agent Command Center. Coordinate parallel AI agents." />
    <title>Ovolve — Multi-Agent Command Center</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ovolve-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Ovolve brand loading screen */
      html.dark, html.dark body, html.dark #root {
        background: linear-gradient(135deg, #0a0d14 0%, #0f1219 50%, #0a0e1a 100%);
        color: #f0f4ff;
      }
      html.light, html.light body, html.light #root {
        background: linear-gradient(135deg, #f0f4ff 0%, #e8eef8 50%, #f0f4ff 100%);
        color: #1a1f2e;
      }
      /* Animated brand gradient for loading state */
      html:not(.light):not(.dark), html:not(.light):not(.dark) body, html:not(.light):not(.dark) #root {
        background: linear-gradient(135deg, #0a0d14 0%, #0f1219 50%, #0a0e1a 100%);
        color: #f0f4ff;
      }
      /* Loading screen removed for MVP */
    </style>
  </head>
  <body class="antialiased bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
